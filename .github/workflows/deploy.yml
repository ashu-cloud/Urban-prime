name: Build & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/urbanprime

jobs:
  # ─── Step 1: Run Go tests ──────────────────────────────────────────
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run unit tests
        run: go test ./Services/... ./pkg/...

  # ─── Step 2: Build & push all service images ──────────────────────
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'   # Only push on merges to main
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - auth-service
          - trip-service
          - driver-service
          - location-service
          - payment-service
          - notification-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .                                         # Build context = repo root (go.work needs this)
          file: Services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

  # ─── Step 3: Deploy to Render (triggers on image push) ───────────
  # Render automatically deploys when the image updates via its webhook.
  # No extra step needed here — Render polls ghcr.io automatically.
