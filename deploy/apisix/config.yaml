apisix:
  node_listen: 9080
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9090

deployment:
  role: data_plane
  role_data_plane:
    config_provider: etcd
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

plugins:
  - api-breaker
  - limit-req
  - jwt-auth
  - cors
  - prometheus
  - proxy-rewrite

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
