syntax = "proto3";

package location.v1;

option go_package = "github.com/cab-booking/proto/gen/location/v1;locationv1";

// LocationUpdate carries a single GPS coordinate reading from a driver's device
message LocationUpdate {
  string driver_id  = 1;
  double latitude   = 2;
  double longitude  = 3;
  float  accuracy   = 4;  // GPS accuracy in meters
  float  speed_kmh  = 5;  // Current speed in km/h
  float  bearing    = 6;  // Compass direction in degrees (0-360)
  int64  timestamp  = 7;  // Unix epoch milliseconds
}

// UpdateDriverLocationRequest is sent by the driver app on every GPS ping (every ~3 seconds)
message UpdateDriverLocationRequest {
  string driver_id  = 1;
  string trip_id    = 2;  // Optional: populated when driver is on an active trip
  double latitude   = 3;
  double longitude  = 4;
  float  speed_kmh  = 5;
  float  bearing    = 6;
}

message UpdateDriverLocationResponse {
  bool success = 1;
}

// GetDriverLocationRequest fetches the last known location of a driver
message GetDriverLocationRequest {
  string driver_id = 1;
}

message GetDriverLocationResponse {
  string driver_id  = 1;
  double latitude   = 2;
  double longitude  = 3;
  int64  updated_at = 4;
}

service LocationService {
  // UpdateDriverLocation is called by the driver app every ~3 seconds
  rpc UpdateDriverLocation(UpdateDriverLocationRequest) returns (UpdateDriverLocationResponse);
  // GetDriverLocation returns the last known GPS position of a driver
  rpc GetDriverLocation(GetDriverLocationRequest)      returns (GetDriverLocationResponse);
}
