syntax = "proto3";

package location.v1;

option go_package = "github.com/cab-booking/proto/gen/location/v1;locationv1";

message DriverLocation {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  double heading = 4;
  int64 timestamp = 5;
}

message UpdateLocationRequest {
  DriverLocation location = 1;
}

message UpdateLocationResponse {
  bool acknowledged = 1;
}

message GetNearbyDriversRequest {
  double latitude = 1;
  double longitude = 2;
  double radius_km = 3;
  int32 limit = 4;
}

message GetNearbyDriversResponse {
  repeated DriverLocation drivers = 1;
}

service LocationService {
  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse);
  rpc GetNearbyDrivers(GetNearbyDriversRequest) returns (GetNearbyDriversResponse);
}
